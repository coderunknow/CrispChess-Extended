name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build jobs are read-only. Only the tag-only publication job may write releases.
permissions:
  contents: read

env:
  # Prebuilt CrispASR library for voice moves (tool/bundle_crispasr.sh).
  # v0.8.37 is the first with phrase scoring (crispasr_session_score_texts),
  # v0.8.38 the first whose iOS framework targets iOS 15.0; with an older one
  # the app keeps the microphone hidden. iOS takes the same
  # release's xcframework (tool/ios_crispasr.sh); ios-release.yml pins it too.
  CRISPASR_VERSION: v0.8.38
  FLUTTER_VERSION: '3.44.2'
  RUST_VERSION: '1.99.1'

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Build Linux
        shell: bash
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee linux-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: linux-build-log-${{ github.job }}
          path: linux-build.log
      # package:onnxruntime bundles its native library for Android, iOS, macOS
      # and Windows, and expects the system to provide it on Linux — where
      # almost nobody has it. The Lc0 engine then falls back to the pure-Dart
      # runtime, which is correct but measured at 6.10ms per position against
      # 1.06ms native, so a Linux user was quietly getting a fifth of the
      # search for the same move budget. Flutter's rpath covers `lib/` next to
      # the executable, which is how the Frozenight library already travels.
      - name: Bundle the native ONNX Runtime
        run: |
          version=1.15.1
          curl -sSLf --retry 3 -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-linux-x64-$version.tgz"
          tar -xzf ort.tgz
          cp -P "onnxruntime-linux-x64-$version/lib/"libonnxruntime.so* \
            build/linux/x64/release/bundle/lib/
          ls -la build/linux/x64/release/bundle/lib/ | grep onnx
      - name: Bundle CrispASR (voice moves)
        run: tool/bundle_crispasr.sh linux build/linux/x64/release/bundle
      - run: |
          cd build/linux/x64/release/bundle
          tar czf $GITHUB_WORKSPACE/CrispChess-linux-x64.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64
          path: CrispChess-linux-x64.tar.gz

  build-linux-frozenight:
    name: Linux + Frozenight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: cargo build --locked --release
        working-directory: native/frozenight
      - name: Build Linux
        shell: bash
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee linux-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: linux-build-log-${{ github.job }}
          path: linux-build.log
      # package:onnxruntime bundles its native library for Android, iOS, macOS
      # and Windows, and expects the system to provide it on Linux — where
      # almost nobody has it. The Lc0 engine then falls back to the pure-Dart
      # runtime, which is correct but measured at 6.10ms per position against
      # 1.06ms native, so a Linux user was quietly getting a fifth of the
      # search for the same move budget. Flutter's rpath covers `lib/` next to
      # the executable, which is how the Frozenight library already travels.
      - name: Bundle the native ONNX Runtime
        run: |
          version=1.15.1
          curl -sSLf --retry 3 -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-linux-x64-$version.tgz"
          tar -xzf ort.tgz
          cp -P "onnxruntime-linux-x64-$version/lib/"libonnxruntime.so* \
            build/linux/x64/release/bundle/lib/
          ls -la build/linux/x64/release/bundle/lib/ | grep onnx
      - name: Bundle CrispASR (voice moves)
        run: tool/bundle_crispasr.sh linux build/linux/x64/release/bundle
      - run: |
          cp native/frozenight/target/release/libfrozenight_ffi.so build/linux/x64/release/bundle/lib/
          cd build/linux/x64/release/bundle
          tar czf $GITHUB_WORKSPACE/CrispChess-linux-x64-frozenight.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64-frozenight
          path: CrispChess-linux-x64-frozenight.tar.gz

  build-frozenight-libs:
    name: Frozenight Native Libraries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: native/frozenight

      - name: Build macOS
        run: cargo build --locked --release
        working-directory: native/frozenight

      - name: Build iOS arm64
        run: cargo build --locked --release --target aarch64-apple-ios
        working-directory: native/frozenight

      - name: Package libraries
        run: |
          mkdir -p frozenight-libs
          cp native/frozenight/target/release/libfrozenight_ffi.dylib frozenight-libs/
          cp native/frozenight/target/aarch64-apple-ios/release/libfrozenight_ffi.a frozenight-libs/
          tar czf frozenight-libs.tar.gz frozenight-libs/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frozenight-libs
          path: frozenight-libs.tar.gz

  build-ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Bundle CrispASR (voice moves)
        run: |
          flutter pub get
          gem install xcodeproj --no-document
          tool/ios_crispasr.sh
      - name: Build iOS with numeric Darwin bundle version
        run: |
          read -r version build < <(python3 -c 'from tools.release_version import read_version; print(*read_version())')
          flutter build ios --release --no-codesign --build-name "$version" --build-number "$build"
      - run: |
          cd build/ios/iphoneos
          APP=$(ls -d *.app | head -1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r $GITHUB_WORKSPACE/CrispChess-ios-unsigned.ipa Payload/
      - name: Verify unsigned IPA identity and version
        run: python3 tools/verify_ios_ipa.py CrispChess-ios-unsigned.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-unsigned
          path: CrispChess-ios-unsigned.ipa

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build macOS with numeric Darwin bundle version
        run: |
          read -r version build < <(python3 -c 'from tools.release_version import read_version; print(*read_version())')
          flutter build macos --release --build-name "$version" --build-number "$build"
      - name: Verify macOS app identity and version
        run: python3 tools/verify_macos_app.py build/macos/Build/Products/Release/CrispChess.app
      - name: Bundle CrispASR (voice moves)
        run: tool/bundle_crispasr.sh macos "$(ls -d build/macos/Build/Products/Release/*.app | head -1)"
      - run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          echo "Found app: $APP"
          tar czf $GITHUB_WORKSPACE/CrispChess-macos.tar.gz "$APP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-app
          path: CrispChess-macos.tar.gz

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build the pinned Frozenight runtime
        run: cargo build --locked --release
        working-directory: native/frozenight
      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { throw 'flutter build windows failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: windows-build-log
          path: windows-build.log
          if-no-files-found: warn
      - name: Bundle the MSVC runtime app-locally
        shell: pwsh
        run: tool/bundle_msvc_windows.ps1 build\windows\x64\runner\Release
      - name: Bundle CrispASR (voice moves)
        shell: bash
        run: tool/bundle_crispasr.sh windows build/windows/x64/runner/Release
      - name: Install the hash-pinned PE verifier
        run: python -m pip install --require-hashes -r tools/requirements-windows.txt
      - name: Bundle and verify Frozenight before packaging
        shell: bash
        run: |
          set -o pipefail
          tool/bundle_frozenight_windows.sh build/windows/x64/runner/Release 2>&1 | tee windows-bundle.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: windows-bundle-log
          path: windows-bundle.log
          if-no-files-found: warn
      - name: Package and verify the extracted archive
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath CrispChess-windows-x64.zip
          Expand-Archive CrispChess-windows-x64.zip -DestinationPath $env:RUNNER_TEMP\windows-release -Force
          python tools/verify_windows_bundle.py $env:RUNNER_TEMP\windows-release --manifest windows-bundle-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Extracted release archive verification failed' }
      - name: Probe the extracted archive runtime and launch the delivered executable
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'windows-release'
          dart tool/native/frozenight_probe.dart (Join-Path $runtime 'frozenight_ffi.dll') ready 200
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Frozenight runtime probe failed' }
          $exe = Join-Path $runtime 'crispchess.exe'
          $proc = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) { throw "Delivered executable exited early: $($proc.ExitCode)" }
          $modules = $proc.Modules | ForEach-Object { $_.FileName }
          $modules | ConvertTo-Json | Out-File windows-loaded-modules.json -Encoding utf8
          foreach ($name in @('flutter_windows.dll','vcruntime140.dll','msvcp140.dll','vcomp140.dll')) {
            $expected = Join-Path $runtime $name
            if (-not ($modules | Where-Object { $_ -ieq $expected })) {
              throw "$name was not loaded from the extracted archive"
            }
          }
          Stop-Process -Id $proc.Id -Force
      - name: Upload Windows runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-runtime-evidence
          path: windows-loaded-modules.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-bundle-manifest
          path: windows-bundle-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: CrispChess-windows-x64.zip

  build-web:
    name: Web (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Web (WASM, with a real JS fallback)
        shell: bash
        run: |
          # web/index.html launches through Flutter's generated bootstrap.
          # A WASM release must provide the WASM entrypoint and bootstrap; the
          # JavaScript fallback must provide main.dart.js and the bootstrap.
          # A failed compiler can leave partial files, so validate each output.
          if flutter build web --release --wasm \
              && test -s build/web/main.dart.wasm \
              && test -s build/web/flutter_bootstrap.js; then
            echo "Using verified Flutter WASM output (main.dart.wasm)."
          else
            echo "WASM build failed or emitted incomplete output; rebuilding JavaScript."
            rm -rf build/web
            flutter build web --release
            test -s build/web/main.dart.js
            test -s build/web/flutter_bootstrap.js
          fi
      - run: |
          cd build/web
          tar czf $GITHUB_WORKSPACE/CrispChess-web.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web
          path: CrispChess-web.tar.gz

  post-failure-logs:
    name: Post build failure logs
    needs: [build-android, build-ios, build-linux, build-linux-frozenight, build-frozenight-libs, build-macos, build-windows, build-web]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-log*'
          path: logs
      - name: Comment on the PR without exposing a write token to build code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          posted=0
          while IFS= read -r -d '' f; do
            rel="${f#logs/}"
            { echo "### Build failure log: $rel"; echo '```'; tail -c 60000 "$f"; echo '```'; } > failure-comment.md
            gh pr comment '${{ github.event.pull_request.number }}' --repo '${{ github.repository }}' --body-file failure-comment.md
            posted=1
          done < <(find logs -type f -name '*.log' -print0)
          if [ "$posted" -eq 0 ]; then echo 'No build failure log artifacts were uploaded.'; fi

  verify-release-assets:
    name: Verify all release assets
    needs: [build-android, build-ios, build-linux, build-linux-frozenight, build-frozenight-libs, build-macos, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Install the hash-pinned PE verifier
        run: python3 -m pip install --require-hashes -r tools/requirements-windows.txt
      - name: Fail closed on missing or invalid platform output
        run: python3 tools/verify_release_assets.py artifacts --report release-asset-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-asset-verification
          path: release-asset-verification.json

  create-release:
    name: GitHub Release
    needs: [verify-release-assets]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Require reviewed release notes for this tag
        run: |
          set -euo pipefail
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          cp "docs/releases/${GITHUB_REF_NAME}.md" release-notes.md
      - name: Publish prerelease assets
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/ios-unsigned/CrispChess-ios-unsigned.ipa
            artifacts/linux-x64/CrispChess-linux-x64.tar.gz
            artifacts/linux-x64-frozenight/CrispChess-linux-x64-frozenight.tar.gz
            artifacts/macos-app/CrispChess-macos.tar.gz
            artifacts/windows-x64/CrispChess-windows-x64.zip
            artifacts/windows-bundle-manifest/windows-bundle-manifest.json
            artifacts/web/CrispChess-web.tar.gz
            artifacts/frozenight-libs/frozenight-libs.tar.gz
