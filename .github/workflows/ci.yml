name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.appstoreconnect/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Everything here reads the repository and builds; uploads use
# the artifacts API, which needs nothing from this token. Without a `permissions`
# block the workflow inherits the repository default, which may be read-write.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release tooling
        run: python3 -m unittest discover -s tools/tests -v
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # Was `continue-on-error: true`, which meant a red suite still showed a
      # green CI — the check existed but could not fail.
      - name: Run tests
        run: flutter test
      - name: Automated UI and engine lifecycle integration tests
        run: flutter test integration_test/app_test.dart integration_test/engine_lifecycle_test.dart

  # Plays the engines against each other and fails on an illegal move, a throw
  # or a hang. Every engine bug this session cost a tournament to notice:
  # Frozenight applying no moves at all and answering for the wrong side, then
  # emitting castling as e8h8; Lc0 loading weights that returned garbage; the
  # built-in engine reporting "no legal moves" from the starting position on a
  # short budget. A unit test asserts what someone thought to ask; a game
  # asserts that the engine can still play chess.
  engine-gate:
    name: Engines play legal chess
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Only engines whose artifacts are committed, so the gate needs no
      # network and cannot go red because a CDN was slow.
      - name: Round robin
        env:
          TOURNAMENT_STRICT: "1"
          TOURNAMENT_ENGINES: "Built-in,Frozenight WASM,Lynx WASM"
          TOURNAMENT_REQUIRE: "Built-in,Frozenight WASM,Lynx WASM"
          TOURNAMENT_MOVETIME_MS: "100"
          TOURNAMENT_GAMES: "1"
          TOURNAMENT_PLY_CAP: "40"
          TOURNAMENT_HANG_SECONDS: "30"
        run: flutter test tool/perf/tournament.dart
      - name: Real Frozenight WASM load/search/dispose soak
        run: node tool/uci/frozenight_wasm_lifecycle.mjs 100

  # Build Frozenight native library for Linux
  frozenight-linux:
    name: Frozenight (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/frozenight
      - name: Build Frozenight FFI
        run: cargo build --release
        working-directory: native/frozenight
      - uses: actions/upload-artifact@v4
        with:
          name: frozenight-linux
          path: native/frozenight/target/release/libfrozenight_ffi.so
          retention-days: 14

  # Build Frozenight native library for macOS
  frozenight-macos:
    name: Frozenight (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/frozenight
      - name: Build Frozenight FFI
        run: cargo build --release
        working-directory: native/frozenight
      - uses: actions/upload-artifact@v4
        with:
          name: frozenight-macos
          path: native/frozenight/target/release/libfrozenight_ffi.dylib
          retention-days: 14

  # Build Frozenight WASM for web
  frozenight-wasm:
    name: Frozenight (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/frozenight-wasm
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build Frozenight WASM
        run: wasm-pack build --target web --release
        working-directory: native/frozenight-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: frozenight-wasm
          path: |
            native/frozenight-wasm/pkg/frozenight_wasm.js
            native/frozenight-wasm/pkg/frozenight_wasm_bg.wasm
          retention-days: 14

  # Build Frozenight for iOS (arm64 static library)
  frozenight-ios:
    name: Frozenight (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/frozenight
      - name: Build Frozenight for iOS arm64
        run: cargo build --release --target aarch64-apple-ios
        working-directory: native/frozenight
      - uses: actions/upload-artifact@v4
        with:
          name: frozenight-ios-arm64
          path: native/frozenight/target/aarch64-apple-ios/release/libfrozenight_ffi.a
          retention-days: 14

  # Build Frozenight for Android (arm64)
  frozenight-android:
    name: Frozenight (Android arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/frozenight
      - name: Install Android NDK linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build Frozenight for Android arm64
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-gnu-gcc
          cargo build --release --target aarch64-linux-android
        working-directory: native/frozenight
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frozenight-android-arm64
          path: native/frozenight/target/aarch64-linux-android/release/libfrozenight_ffi.so
          retention-days: 14

  # Build Frozenight for Windows
  frozenight-windows:
    name: Frozenight (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/frozenight
      - name: Build Frozenight FFI
        run: cargo build --release
        working-directory: native/frozenight
      - uses: actions/upload-artifact@v4
        with:
          name: frozenight-windows
          path: native/frozenight/target/release/frozenight_ffi.dll
          retention-days: 14

  # Flutter builds (no Frozenight dependency — DartEngine only)
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS with numeric Darwin bundle version
        run: |
          read -r version build < <(python3 -c 'from tools.release_version import read_version; print(*read_version())')
          flutter build ios --no-codesign --release --build-name "$version" --build-number "$build"

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: analyze
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS with the verified numeric bundle version
        shell: bash
        run: |
          read -r version build < <(python3 -c 'from tools.release_version import read_version; print(*read_version())')
          flutter build macos --release --build-name "$version" --build-number "$build"
      - name: Verify macOS app identity and version
        run: python3 tools/verify_macos_app.py build/macos/Build/Products/Release/CrispChess.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/CrispChess.app
          retention-days: 14

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: analyze
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter build linux --release
      - name: Package
        run: |
          cd build/linux/x64/release/bundle
          tar czf $GITHUB_WORKSPACE/crispchess-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: crispchess-linux-x64.tar.gz
          retention-days: 14

  build-web:
    name: Build Web (WASM)
    runs-on: ubuntu-latest
    needs: analyze
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Web (WASM, with JavaScript fallback)
        shell: bash
        run: |
          if flutter build web --release --wasm \
              && test -s build/web/main.dart.wasm \
              && test -s build/web/flutter_bootstrap.js; then
            echo "Using verified Flutter WASM output."
          else
            echo "WASM build failed or is incomplete; rebuilding JavaScript."
            rm -rf build/web
            flutter build web --release
            test -s build/web/main.dart.js
            test -s build/web/flutter_bootstrap.js
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 14

  # Bundle Frozenight with Linux build
  bundle-linux-frozenight:
    name: Bundle Linux + Frozenight
    runs-on: ubuntu-latest
    needs: [build-linux, frozenight-linux]
    if: always() && needs.build-linux.result == 'success' && needs.frozenight-linux.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: bundle/
      - uses: actions/download-artifact@v4
        with:
          name: frozenight-linux
          path: bundle/
      - name: Package with Frozenight
        run: |
          cd bundle
          mkdir -p app
          tar xzf crispchess-linux-x64.tar.gz -C app/
          cp libfrozenight_ffi.so app/lib/
          cd app && tar czf $GITHUB_WORKSPACE/crispchess-linux-x64-frozenight.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-frozenight
          path: crispchess-linux-x64-frozenight.tar.gz
          retention-days: 14
