# Temporary read-only verification for PR #15: proves the three Vercel
# repository secrets are present, non-empty, carry the expected identifiers,
# and that VERCEL_TOKEN authenticates against the Vercel API.
#
# Security: secret values only ever live in step `env`; comparisons print
# match/mismatch words and HTTP status codes only; API response bodies are
# written to a file that is never printed. This workflow is removed from the
# branch once verification has been recorded.
name: Verify Vercel secrets

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Presence, identity, and token check (values never logged)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Secrets are present, non-empty, and match the linked project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          fail=0
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN: present and non-empty"
          else
            echo "::error::VERCEL_TOKEN is missing or empty"
            fail=1
          fi
          if [ -n "$VERCEL_ORG_ID" ]; then
            echo "VERCEL_ORG_ID: present and non-empty"
          else
            echo "::error::VERCEL_ORG_ID is missing or empty"
            fail=1
          fi
          if [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_PROJECT_ID: present and non-empty"
          else
            echo "::error::VERCEL_PROJECT_ID is missing or empty"
            fail=1
          fi
          # Value identity without exposing values: compare against the
          # identifiers of the linked Vercel project, print only the verdict.
          if [ "$VERCEL_ORG_ID" = "team_NK7ZIqw551PrQnND7BHTILmP" ]; then
            echo "VERCEL_ORG_ID: matches the linked Vercel team"
          else
            echo "::error::VERCEL_ORG_ID does not match team_NK7ZIqw551PrQnND7BHTILmP"
            fail=1
          fi
          if [ "$VERCEL_PROJECT_ID" = "prj_DZcwY0VDo3lYLHm2pZQKWm2N3nuC" ]; then
            echo "VERCEL_PROJECT_ID: matches the linked Vercel project"
          else
            echo "::error::VERCEL_PROJECT_ID does not match prj_DZcwY0VDo3lYLHm2pZQKWm2N3nuC"
            fail=1
          fi
          exit $fail

      - name: VERCEL_TOKEN can reach the API and read the linked project (status only)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Never print the token. Response bodies are reduced to Vercel's
          # error code/message fields (API errors do not echo credentials).
          PROBE_STATUS=000
          probe() {
            label="$1"; url="$2"; auth="$3"
            if [ "$auth" = "yes" ]; then
              code=$(curl -sS -D /tmp/hdrs.txt -o /tmp/body.json -w '%{http_code}' \
                -H "Authorization: Bearer $VERCEL_TOKEN" "$url") || code=000
            else
              code=$(curl -sS -D /tmp/hdrs.txt -o /tmp/body.json -w '%{http_code}' \
                "$url") || code=000
            fi
            server=$(grep -i '^server:' /tmp/hdrs.txt | tr -d '\r' | head -1)
            ctype=$(grep -i '^content-type:' /tmp/hdrs.txt | tr -d '\r' | head -1)
            echo "$label -> HTTP $code | $server | $ctype"
            if printf '%s' "$ctype" | grep -qi json; then
              msg=$(jq -r 'if type=="object" and .error then ((.error.code // "?") + ": " + (.error.message // "")) else "response OK (no error field)" end' /tmp/body.json 2>/dev/null || echo "unparseable JSON body")
              echo "$label detail: $msg"
            else
              echo "$label detail: non-JSON body suppressed"
            fi
            PROBE_STATUS="$code"
          }

          echo "--- baseline: unauthenticated (host sanity; a real Vercel API answers 401) ---"
          probe "anon /v2/user" "https://api.vercel.com/v2/user" no
          base=$PROBE_STATUS

          echo "--- authenticated probes ---"
          probe "auth /v2/user" "https://api.vercel.com/v2/user" yes
          user_status=$PROBE_STATUS
          probe "auth project lookup" "https://api.vercel.com/v9/projects/prj_DZcwY0VDo3lYLHm2pZQKWm2N3nuC?teamId=team_NK7ZIqw551PrQnND7BHTILmP" yes
          proj_status=$PROBE_STATUS
          probe "auth deployments list" "https://api.vercel.com/v6/deployments?teamId=team_NK7ZIqw551PrQnND7BHTILmP&limit=1" yes
          dep_status=$PROBE_STATUS

          echo "summary: baseline=$base user=$user_status project=$proj_status deployments=$dep_status"

          # The deploy workflow needs an authenticated token that can see the
          # linked project. User-identity scope is informational only (a
          # least-privilege deploy token may not expose it).
          fail=0
          if [ "$proj_status" = "200" ]; then
            echo "VERCEL_TOKEN: authenticated and can read the linked project"
          else
            echo "::error::VERCEL_TOKEN cannot read the linked project (HTTP $proj_status)"
            fail=1
          fi
          if [ "$dep_status" = "200" ]; then
            echo "VERCEL_TOKEN: can list deployments (deploy-scope capability present)"
          else
            echo "::warning::deployment list returned HTTP $dep_status - check token scopes if deploy later fails"
          fi
          exit $fail
