# Temporary read-only verification for PR #15: proves the three Vercel
# repository secrets are present, non-empty, carry the expected identifiers,
# and that VERCEL_TOKEN authenticates against the Vercel API.
#
# Security: secret values only ever live in step `env`; comparisons print
# match/mismatch words and HTTP status codes only; API response bodies are
# written to a file that is never printed. This workflow is removed from the
# branch once verification has been recorded.
name: Verify Vercel secrets

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Presence, identity, and token check (values never logged)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Secrets are present, non-empty, and match the linked project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          fail=0
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN: present and non-empty"
          else
            echo "::error::VERCEL_TOKEN is missing or empty"
            fail=1
          fi
          if [ -n "$VERCEL_ORG_ID" ]; then
            echo "VERCEL_ORG_ID: present and non-empty"
          else
            echo "::error::VERCEL_ORG_ID is missing or empty"
            fail=1
          fi
          if [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_PROJECT_ID: present and non-empty"
          else
            echo "::error::VERCEL_PROJECT_ID is missing or empty"
            fail=1
          fi
          # Value identity without exposing values: compare against the
          # identifiers of the linked Vercel project, print only the verdict.
          if [ "$VERCEL_ORG_ID" = "team_NK7ZIqw551PrQnND7BHTILmP" ]; then
            echo "VERCEL_ORG_ID: matches the linked Vercel team"
          else
            echo "::error::VERCEL_ORG_ID does not match team_NK7ZIqw551PrQnND7BHTILmP"
            fail=1
          fi
          if [ "$VERCEL_PROJECT_ID" = "prj_DZcwY0VDo3lYLHm2pZQKWm2N3nuC" ]; then
            echo "VERCEL_PROJECT_ID: matches the linked Vercel project"
          else
            echo "::error::VERCEL_PROJECT_ID does not match prj_DZcwY0VDo3lYLHm2pZQKWm2N3nuC"
            fail=1
          fi
          exit $fail

      - name: VERCEL_TOKEN authenticates and can see the project (status only)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Never print the token or any response body - status codes only.
          user_code=$(curl -sS -o /tmp/vercel_user.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user) || user_code=000
          echo "Vercel API /v2/user HTTP status: $user_code"
          if [ "$user_code" != "200" ]; then
            echo "::error::VERCEL_TOKEN did not authenticate (HTTP $user_code). Body suppressed."
            exit 1
          fi
          proj_code=$(curl -sS -o /tmp/vercel_proj.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_DZcwY0VDo3lYLHm2pZQKWm2N3nuC?teamId=team_NK7ZIqw551PrQnND7BHTILmP") || proj_code=000
          echo "Vercel API project lookup HTTP status: $proj_code"
          if [ "$proj_code" != "200" ]; then
            echo "::error::Token cannot read the linked project (HTTP $proj_code). Body suppressed."
            exit 1
          fi
          echo "Token authenticated; linked project visible to the token."
          rm -f /tmp/vercel_user.json /tmp/vercel_proj.json
